{% extends 'layout.html' %}
{% load i18n %}
{% block body %}
    <!-- Breadcrumb Section Begin -->
    <div class="breadcrumb-option spad set-bg" data-setbg="/static/img/breadcrumb-bg.jpg">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <div class="breadcrumb__text">
                        <h2>{% translate 'Our Shop' %}</h2>
                        <div class="breadcrumb__links">
                            <span>{% translate 'Product' %}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Breadcrumb Section End -->

    <!-- Shop Section Begin -->
    <section class="shop spad">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 order-lg-2">
    
                    <div class="row">
                      {% for product in products %}
                        <div class="col-lg-4 col-md-4 col-sm-6">
                            <div class="product__item">
                                <div class="product__item__pic">
                                    <img width="200" src="{{product.images.first.image_url}}" alt="">

                                </div>
                                <div class="product__item__text">
                                    <h6><a href="#">{{product.part_name}}</a></h6>
                                    <h6><a href="#">{{product.model_name}}</a></h6>
                                    <div class="price">
                                        <span>{{product.price}}</span>
                                        <a href="{% url 'products:show' product.id %}">{% translate 'View Product' %}</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                      {% endfor %}

                    </div>

                </div>

        </div>
    </section>
    <!-- Shop Section End -->
{% endblock %}
