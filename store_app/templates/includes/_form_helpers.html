{% macro render_field(field, class='custom_input', placeholder=field.label.text) %}
{#<dt>{{ field.label }}#}
<dd>{{ field(class_=class, placeholder=placeholder, **kwargs)|safe }}
{% if field.errors %}
  <ul class=custom_form_errors>
  {% for error in field.errors %}
    <li>{{ error }}</li>
  {% endfor %}
  </ul>
{% endif %}
</dd>
{% endmacro %}
